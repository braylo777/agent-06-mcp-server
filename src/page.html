<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MCP Server</title>
<style>body{font-family:system-ui;max-width:760px;margin:32px auto;padding:0 16px;background:#0b1730;color:#eef}a{color:#9cf}textarea,input,select,button{font-size:15px;padding:8px;border-radius:6px;border:1px solid #345;background:#13234a;color:#eef}textarea{width:100%;box-sizing:border-box}button{cursor:pointer;background:#2b5bd7}pre{background:#13234a;padding:12px;white-space:pre-wrap;border-radius:6px;max-height:480px;overflow:auto}.row{display:flex;gap:8px;margin:8px 0}</style></head>
<body><h1>MCP Server</h1><p>A remote Model Context Protocol server on Cloudflare Workers. Endpoint: <code>/mcp</code> (Streamable HTTP). Use this page as an inspector, or connect any MCP client.</p>
<div class=row><select id=ep><option value="0">POST /mcp — initialize</option><option value="1">POST /mcp — tools/list</option><option value="2">POST /mcp — call calculator</option><option value="3">POST /mcp — call word_stats</option><option value="4">POST /mcp — call search_notes</option><option value="5">POST /mcp — resources/read</option></select><button id=go>Send</button></div>
<textarea id=bd rows=5></textarea><p style="opacity:.7;font-size:13px">Edit the JSON body and press Send. Rate limited to keep this demo on the free tier. Source on <a href="https://github.com/braylo777/agent-06-mcp-server">GitHub</a>.</p>
<h3>Response</h3><pre id=out></pre>
<script>
const S=localStorage.sid||(localStorage.sid=Math.random().toString(36).slice(2,10));
const E=[{"label": "initialize", "method": "POST", "path": "/mcp", "body": {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "inspector", "version": "1"}}}}, {"label": "tools/list", "method": "POST", "path": "/mcp", "body": {"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}}}, {"label": "call calculator", "method": "POST", "path": "/mcp", "body": {"jsonrpc": "2.0", "id": 3, "method": "tools/call", "params": {"name": "calculator", "arguments": {"expression": "(17*23)+4"}}}}, {"label": "call word_stats", "method": "POST", "path": "/mcp", "body": {"jsonrpc": "2.0", "id": 4, "method": "tools/call", "params": {"name": "word_stats", "arguments": {"text": "MCP is great. Agents love tools!"}}}}, {"label": "call search_notes", "method": "POST", "path": "/mcp", "body": {"jsonrpc": "2.0", "id": 5, "method": "tools/call", "params": {"name": "search_notes", "arguments": {"query": "workers"}}}}, {"label": "resources/read", "method": "POST", "path": "/mcp", "body": {"jsonrpc": "2.0", "id": 6, "method": "resources/read", "params": {"uri": "notes://all"}}}];
const fill=()=>{const x=E[ep.value];bd.value=x.body?JSON.stringify(x.body,null,2).replaceAll("{{session}}",S):"";bd.disabled=x.method==="GET"};
ep.onchange=fill;fill();
go.onclick=async()=>{const x=E[ep.value];out.textContent="working…";const t0=Date.now();
try{const r=await fetch(x.path.replaceAll("{{session}}",S),x.method==="GET"?{}:{method:"POST",headers:{"content-type":"application/json"},body:bd.value});
out.textContent=`HTTP ${r.status} · ${Date.now()-t0} ms\n\n`+JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=String(e)}};
</script></body></html>
